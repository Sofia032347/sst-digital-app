<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios - SST Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/usuarios.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4 shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
        <span class="navbar-brand mb-0 h1 fs-5">SST - Gestión de RRHH</span>
        <form th:action="@{/logout}" method="post" id="formLogout" class="d-inline">
            <button type="submit" class="btn-logout" style="border: none; cursor: pointer;">
                <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
            </button>
        </form>
    </div>
</nav>

<div class="container mt-4">

    <div class="mb-4">
        <a th:href="@{/actividades/rrhh}" class="btn btn-outline-secondary btn-sm shadow-sm">
            <i class="bi bi-arrow-left"></i> Volver al Panel
        </a>
    </div>

    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
        <h2 class="h4 fw-bold mb-0">Gestión de Empleados</h2>
        <button type="button" class="btn btn-success shadow-sm fw-bold" data-bs-toggle="modal" data-bs-target="#modalAgregarUsuario">
            <i class="bi bi-plus-lg"></i> Agregar Nuevo Empleado
        </button>
    </div>

    <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
        <div class="card-header bg-primary text-white py-3">
            <h5 class="mb-0 fs-6">Lista de Empleados en el Sistema</h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4">Nombre</th>
                        <th>Email</th>
                        <th>Departamento</th>
                        <th>Rol</th>
                        <th class="text-center pe-4">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${listaUsuarios}">
                        <td class="ps-4 fw-semibold" th:text="${u.nombre}"></td>
                        <td th:text="${u.email}"></td>
                        <td th:text="${u.departamento}"></td>
                        <td>
                            <span class="badge bg-info-subtle text-info-emphasis border border-info-subtle" th:text="${u.rol?.nombre}"></span>
                        </td>
                        <td class="text-center pe-4">
                            <div class="d-flex justify-content-center gap-2">
                                <button type="button" class="btn btn-warning btn-sm"
                                        data-bs-toggle="modal"
                                        th:data-bs-target="'#modalEditar' + ${u.id}">
                                    <i class="bi bi-pencil-square"></i>
                                </button>

                                <a th:href="@{/usuarios/eliminar/{id}(id=${u.id})}" class="btn btn-danger btn-sm"
                                   onclick="return confirm('¿Estás seguro de eliminar a este empleado?');">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </div>

                            <div class="modal fade" th:id="'modalEditar' + ${u.id}" tabindex="-1" aria-hidden="true">
                                <div class="modal-dialog modal-dialog-centered text-start">
                                    <div class="modal-content border-0 shadow">
                                        <div class="modal-header bg-warning">
                                            <h5 class="modal-title fw-bold">Editar Información</h5>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                        </div>
                                        <form th:action="@{/usuarios/actualizar/{id}(id=${u.id})}" method="post">
                                            <div class="modal-body p-4">
                                                <div class="mb-3">
                                                    <label class="form-label fw-bold">Nombre Completo</label>
                                                    <input type="text" class="form-control" name="nombre" th:value="${u.nombre}" required>
                                                </div>
                                                <div class="mb-3">
                                                    <label class="form-label fw-bold">Correo Electrónico</label>
                                                    <input type="email" class="form-control" name="email" th:value="${u.email}" required>
                                                </div>
                                                <div class="mb-3">
                                                    <label class="form-label fw-bold">Contraseña</label>
                                                    <input type="password" class="form-control" name="password" placeholder="Nueva contraseña">
                                                    <small class="text-muted">Dejar en blanco para no cambiarla.</small>
                                                </div>
                                                <div class="mb-3">
                                                    <label class="form-label fw-bold">Departamento</label>
                                                    <input type="text" class="form-control" name="departamento" th:value="${u.departamento}" required>
                                                </div>
                                                <div class="mb-3">
                                                    <label class="form-label fw-bold">Rol del Sistema</label>
                                                    <select class="form-select" name="rol" required>
                                                        <option th:each="rol : ${listaRoles}"
                                                                th:value="${rol.id}"
                                                                th:text="${rol.nombre}"
                                                                th:selected="${rol.id == u.rol?.id}"></option>
                                                    </select>
                                                </div>
                                            </div>
                                            <div class="modal-footer bg-light">
                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                                                <button type="submit" class="btn btn-warning fw-bold">Guardar Cambios</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${listaUsuarios.isEmpty()}">
                        <td colspan="5" class="text-center text-muted py-4">No hay empleados registrados.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalAgregarUsuario" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title fw-bold">Registrar Nuevo Empleado</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/usuarios/guardar}" th:object="${nuevoUsuario}" method="post">
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Nombre Completo</label>
                        <input type="text" class="form-control" th:field="*{nombre}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Correo Electrónico</label>
                        <input type="email" class="form-control" th:field="*{email}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Contraseña</label>
                        <input type="password" class="form-control" th:field="*{password}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Departamento</label>
                        <input type="text" class="form-control" th:field="*{departamento}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Asignar Rol</label>
                        <select class="form-select" th:field="*{rol}" required>
                            <option value="" disabled selected>Seleccione...</option>
                            <option th:each="rol : ${listaRoles}" th:value="${rol.id}" th:text="${rol.nombre}"></option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-success fw-bold">Guardar Usuario</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
