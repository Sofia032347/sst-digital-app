<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios - SST Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/usuarios.css}">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">SST - Gestión de RRHH</span>
        <div class="d-flex align-items-center">

            <form th:action="@{/login}" method="post" class="m-0">
                <button type="submit" class="btn btn-danger btn-sm">Cerrar Sesión</button>
            </form>
        </div>
    </div>
</nav>
<div class="container mt-5">

    <div class="mb-4">
        <a th:href="@{/actividades/rrhh}" class="btn btn-outline-secondary shadow-sm">
            &larr; Volver al Panel de Control de RRHH
        </a>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gestión de Empleados</h2>
        <button type="button" class="btn btn-success shadow-sm" data-bs-toggle="modal" data-bs-target="#modalAgregarUsuario">
            Agregar Nuevo Empleado
        </button>
    </div>

    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Lista de Empleados en el Sistema</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Departamento</th>
                        <th>Rol</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${listaUsuarios}">
                        <td th:text="${u.nombre}"></td>
                        <td th:text="${u.email}"></td>
                        <td th:text="${u.departamento}"></td>
                        <td th:text="${u.rol?.nombre}"></td>
                        <td class="text-center">
                            <button type="button" class="btn btn-warning btn-sm me-1"
                                    data-bs-toggle="modal"
                                    th:data-bs-target="'#modalEditar' + ${u.id}">
                                Editar
                            </button>

                            <a th:href="@{/usuarios/eliminar/{id}(id=${u.id})}" class="btn btn-danger btn-sm"
                               onclick="return confirm('¿Estás seguro de eliminar a este empleado?');">
                                Eliminar
                            </a>

                            <div class="modal fade" th:id="'modalEditar' + ${u.id}" tabindex="-1" aria-hidden="true text-start">
                                <div class="modal-dialog text-start"> <div class="modal-content">
                                    <div class="modal-header bg-warning text-dark">
                                        <h5 class="modal-title">Editar Información del Usuario</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                    </div>
                                    <form th:action="@{/usuarios/actualizar/{id}(id=${u.id})}" method="post">
                                        <div class="modal-body">
                                            <div class="mb-3">
                                                <label class="form-label">Nombre Completo</label>
                                                <input type="text" class="form-control" name="nombre" th:value="${u.nombre}" required>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Correo Electrónico</label>
                                                <input type="email" class="form-control" name="email" th:value="${u.email}" required>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Contraseña</label>
                                                <input type="password" class="form-control" name="password">
                                                <small class="text-muted">Dejar en blanco para no cambiarla.</small>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Departamento</label>
                                                <input type="text" class="form-control" name="departamento" th:value="${u.departamento}" required>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Rol del Sistema</label>
                                                <select class="form-select" name="rol" required>
                                                    <option th:each="rol : ${listaRoles}"
                                                            th:value="${rol.id}"
                                                            th:text="${rol.nombre}"
                                                            th:selected="${rol.id == u.rol?.id}"></option>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="modal-footer">
                                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                            <button type="submit" class="btn btn-warning">Actualizar Cambios</button>
                                        </div>
                                    </form>
                                </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${listaUsuarios.isEmpty()}">
                        <td colspan="5" class="text-center text-muted py-3">No hay empleados registrados en el sistema.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="modalAgregarUsuario" tabindex="-1" aria-labelledby="modalAgregarUsuarioLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title" id="modalAgregarUsuarioLabel">Registrar Nuevo Empleado</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <form th:action="@{/usuarios/guardar}" th:object="${nuevoUsuario}" method="post">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Nombre Completo</label>
                        <input type="text" class="form-control" th:field="*{nombre}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Correo Electrónico</label>
                        <input type="email" class="form-control" th:field="*{email}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" class="form-control" th:field="*{password}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Departamento</label>
                        <input type="text" class="form-control" th:field="*{departamento}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Asignar Rol</label>
                        <select class="form-select" th:field="*{rol}" required>
                            <option value="" disabled selected>Seleccione un rol...</option>
                            <option th:each="rol : ${listaRoles}" th:value="${rol.id}" th:text="${rol.nombre}"></option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-success">Guardar Usuario</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
