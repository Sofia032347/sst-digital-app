<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel RRHH - SST Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/rrhh.css}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

<input type="hidden" id="horaLoginInput" th:value="${session.horaInicioSesion}">

<nav class="navbar-custom">
    <div class="nav-brand">
        <strong>SST Digital - RRHH</strong>
    </div>

    <div class="action-container">
        <a th:href="@{/actividades/pausa-activa}" id="btnAccionPausa" class="btn btn-pausa disabled">
            <i class="bi bi-play-fill"></i> <span class="d-none d-sm-inline">Iniciar mi Pausa Activa (RRHH)</span><span class="d-inline d-sm-none">Pausa Activa</span>
        </a>
    </div>

    <div class="nav-links">
        <a th:href="@{/usuarios}" class="d-none d-md-inline">Gestionar Usuarios</a>
        <form th:action="@{/logout}" method="post" id="formLogout" class="d-inline">
            <button type="submit" class="btn-logout" style="border: none; cursor: pointer;">
                <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
            </button>
        </form>
    </div>
</nav>

<div class="container mt-4">
    <h2 class="mb-4">Panel de Control de Pausas Activas</h2>

    <div id="contenedorAlertas">
        <div class="alert-section shadow-sm" th:if="${!empleadosPendientes.isEmpty()}">
            <h3><i class="bi bi-exclamation-triangle-fill"></i> Alerta: Pausas pendientes hoy</h3>
            <p>Los siguientes usuarios aún no han registrado su pausa:</p>
            <div class="d-flex flex-wrap gap-2 mt-2">
                <span th:each="p : ${empleadosPendientes}" class="badge-pendiente" th:text="${p.nombre + ' (' + p.departamento + ')'}"></span>
            </div>
        </div>
    </div>

    <div class="toolbar d-flex flex-column flex-md-row justify-content-between align-items-end gap-3 bg-light p-3 rounded shadow-sm">

        <form th:action="@{/actividades/rrhh}" method="get" class="d-flex flex-wrap gap-3 align-items-end">
            <div>
                <label class="form-label fw-bold small">Consultar Fecha:</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-calendar3"></i></span>
                    <input type="date" name="fechaRef" th:value="${fechaRef}" class="form-control">
                </div>
            </div>

            <div class="filters">
                <label class="form-label fw-bold small d-block">Rango:</label>
                <div class="btn-group">
                    <button type="submit" name="filtro" value="dia"
                            th:classappend="${filtroActual == 'dia' ? 'active' : ''}" class="btn btn-filter">Día</button>
                    <button type="submit" name="filtro" value="semana"
                            th:classappend="${filtroActual == 'semana' ? 'active' : ''}" class="btn btn-filter">Semana</button>
                    <button type="submit" name="filtro" value="mes"
                            th:classappend="${filtroActual == 'mes' ? 'active' : ''}" class="btn btn-filter">Mes</button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary shadow-sm">
                <i class="bi bi-search"></i> Consultar
            </button>
        </form>

        <a th:href="@{/actividades/descargar}" class="btn btn-green shadow-sm mb-1">
            <i class="bi bi-file-earmark-arrow-down-fill"></i> Descargar CSV
        </a>
    </div>

    <div class="table-responsive shadow-sm rounded mt-4">
        <table class="table table-hover mb-0">
            <thead>
            <tr>
                <th>Empleado</th>
                <th>Departamento</th>
                <th th:text="${periodo == 'HOY' || periodo == 'DIA'} ? 'Hora' : 'Día'">Fecha</th>
                <th th:text="${periodo == 'HOY' || periodo == 'DIA'} ? 'Estado' : 'Rango de Horas'">Detalle</th>
                <th>Duración Total</th>
                <th th:if="${periodo != 'HOY' && periodo != 'DIA'}">Cumplimiento</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="fila : ${datosReporte}">
                <td th:text="${fila.nombre}" class="fw-bold"></td>
                <td th:text="${fila.departamento}"></td>

                <td th:text="${fila.fechaHora != null ? fila.fechaHora : fila.fechaDia}"></td>

                <td th:text="${fila.rangoHoras != null ? fila.rangoHoras : fila.estado}"></td>

                <td th:text="${fila.tiempoTotal + ' seg'}"></td>

                <td th:if="${fila.cantidadPausas != null}">
                <span th:text="${fila.cantidadPausas + ' / 4'}"
                      class="badge"
                      th:classappend="${fila.estado == 'COMPLETO' ? 'bg-success' : 'bg-warning text-dark'}"></span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/rrhh.js}"></script>
</body>
</html>
