<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SST Digital - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/login.css}" rel="stylesheet">
</head>
<body>

<div class="login-card shadow">
    <h2 class="fw-bold">SST Digital</h2>
    <p class="subtitle">Plataforma de Seguridad y Salud en el Trabajo</p>

    <form th:action="@{/login}" th:object="${usuario}" method="post">

        <div class="mb-3 text-start">
            <label class="form-label fw-bold">Correo electrónico</label>
            <input type="email" th:field="*{email}" class="form-control custom-input" placeholder="nombre@empresa.com" required>
        </div>

        <div class="mb-3 text-start">
            <label class="form-label fw-bold">Contraseña</label>
            <input type="password" th:field="*{password}" class="form-control custom-input" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-ingresar">
            Ingresar <i class="bi bi-box-arrow-in-right ms-1"></i>
        </button>

        <div th:if="${error != null}" th:text="${error}" class="error-msg mt-3" role="alert"></div>

        <div class="back-link mt-4">
            <a th:href="@{/index}" class="text-decoration-none">
                <i class="bi bi-arrow-left"></i> Volver al Inicio
            </a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
