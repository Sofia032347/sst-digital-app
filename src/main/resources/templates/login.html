<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SST Digital - Iniciar Sesión</title>
    <link th:href="@{/css/login.css}" rel="stylesheet">
</head>
<body>

<div class="login-card">
    <h2>SST Digital</h2>
    <p>Plataforma de Seguridad y Salud en el Trabajo</p>

    <form th:action="@{/login}" th:object="${usuario}" method="post">

        <input type="email" th:field="*{email}" placeholder="Correo electrónico" required>

        <input type="password" th:field="*{password}" placeholder="Contraseña" required>

        <button type="submit">Ingresar</button>

        <div th:if="${error != null}" th:text="${error}" class="error-msg"></div>

        <div class="back-link">
            <a th:href="@{/}" class="btn-volver">
                <i class="bi bi-arrow-left"></i> Volver al Inicio
            </a>
        </div>

    </form>
</div>

</body>
</html>
