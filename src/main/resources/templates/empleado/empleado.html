<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel - Empleado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/empleado.css}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

<input type="hidden" id="horaLoginInput" th:value="${session.horaInicioSesion}">

<nav class="navbar-employee shadow-sm">
</nav>

<div class="container main-content">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="card employee-card text-center shadow-lg border-0">
                <div class="card-body p-4 p-md-5">
                    <div class="icon-circle mb-4">
                        <i class="bi bi-person-walking"></i>
                    </div>

                    <h2 class="fw-bold text-primary">Pausa Activa</h2>

                    <a th:href="@{/actividades/pausa-activa}" id="btnAccionPausa" class="btn btn-success btn-lg btn-start-pausa mt-4 shadow disabled">
                        <i class="bi bi-hourglass-split"></i> Cargando estado...
                    </a>

                    <div class="mt-5 text-start">
                        <h5 class="fw-bold"><i class="bi bi-list-check"></i> Mi actividad de hoy</h5>
                        <div class="table-responsive mt-3">
                            <table class="table table-hover align-middle bg-white rounded shadow-sm">
                                <thead class="table-light">
                                <tr>
                                    <th>Hora</th>
                                    <th>Estado</th>
                                    <th>Duración</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="act : ${actividadesHoy}">
                                    <td th:text="${#temporals.format(act.fecha, 'HH:mm')}"></td>
                                    <td>
                                        <span th:if="${act.estado == 'COMPLETADA'}" class="badge bg-success">Completada</span>
                                        <span th:if="${act.estado == 'INCOMPLETA'}" class="badge bg-warning text-dark">Incompleta</span>
                                        <span th:if="${act.estado == 'CANCELADA'}" class="badge bg-danger">Cancelada</span>
                                        <span th:if="${act.estado == 'EN_PROCESO'}" class="badge bg-info">En proceso</span>
                                    </td>
                                    <td th:text="${act.duracionSegundos + ' seg'}"></td>
                                </tr>
                                <tr th:if="${actividadesHoy.isEmpty()}">
                                    <td colspan="3" class="text-center text-muted">Aún no tienes registros hoy.</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/empleado.js}"></script>
</body>
</html>
