<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mi Panel - Empleado</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/empleado.css}">
</head>
<body>
<nav>
    <strong>SST Digital - Empleado</strong>

    <div class="user-greeting">
        Bienvenido, <span class="user-name" th:text="${empleado.nombre}">Nombre del Empleado</span>
    </div>

    <div class="nav-links">
        <a th:href="@{/login}" class="btn-logout">Cerrar Sesión</a>
    </div>
</nav>

<div class="container">
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card text-center p-5">
                <h2>Pausa Activa</h2>
                <p class="text-muted mt-3">Realiza tus ejercicios de pausa activa para mantener tu salud y bienestar.</p>

                <div class="alert alert-info mt-4">
                    <strong>Recomendación:</strong> Realiza una pausa activa cada 2 horas de trabajo.
                </div>

                <a th:href="@{/actividades/pausa-activa}" class="btn btn-success btn-lg mt-4">
                    <i class="bi bi-play-fill"></i> Iniciar Pausa Activa Ahora
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
