<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel - Empleado</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/empleado.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4 shadow-sm">
    <div class="container d-flex flex-column flex-sm-row justify-content-between align-items-center gap-3">
        <span class="navbar-brand mb-0 h1 fs-5 fs-md-4">SST Digital - Empleado</span>

        <div class="d-flex flex-column flex-sm-row align-items-center gap-3 text-white">
            <div class="user-greeting text-center text-sm-start">
                Bienvenido(a), <strong class="user-name text-warning" th:text="${empleado.nombre}">Nombre del Empleado</strong>
            </div>

            <form th:action="@{/logout}" method="post" class="m-0 w-100 w-sm-auto">
                <button type="submit" class="btn btn-danger btn-sm w-100">Cerrar Sesión</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6 mt-4 mt-md-5">

            <div class="card shadow border-0 rounded-4 text-center p-4 p-md-5">
                <div class="mb-3 d-none d-md-block">
                    <i class="bi bi-person-workspace text-primary" style="font-size: 3rem;"></i>
                </div>

                <h2 class="text-primary fw-bold">Pausa Activa</h2>
                <p class="text-muted mt-2">Realiza tus ejercicios de pausa activa para mantener tu salud y bienestar.</p>

                <div class="alert alert-info mt-3 text-start shadow-sm border-0">
                    <i class="bi bi-info-circle-fill me-2"></i>
                    <strong>Recomendación:</strong> Realiza una pausa activa cada 2 horas de trabajo.
                </div>

                <div class="d-grid gap-2 mt-4">
                    <a th:href="@{/actividades/pausa-activa}" class="btn btn-success btn-lg shadow">
                        <i class="bi bi-play-fill me-1"></i> Iniciar Pausa Activa Ahora
                    </a>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
