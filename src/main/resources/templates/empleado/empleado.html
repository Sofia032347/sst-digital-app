<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Panel - Empleado</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" th:href="@{/css/empleado.css}">
</head>
<body>

<nav class="navbar-employee shadow-sm">
    <div class="nav-container">
        <strong class="brand">SST Digital - Empleado</strong>

        <div class="user-info d-none d-md-block">
            Bienvenido, <span class="user-name" th:text="${empleado.nombre}">Nombre del Empleado</span>
        </div>

        <div class="nav-actions">
            <form th:action="@{/logout}" method="post" id="formLogout" class="d-inline">
                <button type="submit" class="btn-logout" style="border: none; cursor: pointer;">
                    <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container main-content">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="card employee-card text-center shadow-lg border-0">
                <div class="card-body p-4 p-md-5">
                    <div class="icon-circle mb-4">
                        <i class="bi bi-person-walking"></i>
                    </div>

                    <h2 class="fw-bold text-primary">Pausa Activa</h2>
                    <p class="text-muted fs-5 mt-3">
                        Es momento de cuidar tu salud. Realiza tus ejercicios para mantener tu bienestar físico durante la jornada.
                    </p>

                    <div class="alert alert-info border-0 bg-light-blue mt-4 py-3">
                        <i class="bi bi-info-circle-fill me-2"></i>
                        <strong>Recomendación:</strong> Realiza una pausa activa cada 2 horas de trabajo.
                    </div>

                    <a th:href="@{/actividades/pausa-activa}" class="btn btn-success btn-lg btn-start-pausa mt-4 shadow">
                        <i class="bi bi-play-fill"></i> Iniciar Pausa Activa Ahora
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
