<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SST - Pausa Activa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/pausa-activa.css}">

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
</head>
<body>

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1">SST - Módulo de Salud</span>
        <div class="d-flex align-items-center">
            <span class="text-white me-3">Usuario: <strong th:text="${empleado.nombre}">Nombre</strong></span>
            <form th:action="@{/login}" method="post" class="m-0">
                <button type="submit" class="btn btn-danger btn-sm">Cerrar Sesión</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">

    <a th:href="@{${empleado.rol.nombre == 'RRHH' ? '/actividades/rrhh' : '/actividades/empleado'}}"
       class="btn btn-outline-secondary shadow-sm">
        &larr; Volver al Panel
    </a>

    <div class="row align-items-stretch">

        <div class="col-lg-7">
            <div class="camera-container">
                <video id="videoElement" autoplay playsinline></video>
                <canvas id="output_canvas" class="position-absolute top-0 start-0" style="width: 100%; height: 100%; pointer-events: none;"></canvas>
                <div id="cameraStatus" class="position-absolute top-50 start-50 translate-middle text-white fw-bold">Iniciando cámara...</div>
            </div>

            <div class="mt-3 text-center">
                <span class="badge bg-warning text-dark fs-5 p-2 shadow-sm" id="aiStatus">🤖 IA Esperando iniciar...</span>
            </div>

            <div class="progress mt-3" style="height: 10px;">
                <div id="rutinaProgress" class="progress-bar bg-success" role="progressbar" style="width: 10%;" aria-valuenow="10" aria-valuemin="0" aria-valuemax="100"></div>
            </div>
            <p class="text-center text-muted small mt-1" id="progresoTexto">Preparación</p>
        </div>

        <div class="col-lg-5">
            <div class="card exercise-card p-4 h-100">
                <h4 id="exerciseTitle" class="text-primary fw-bold text-center">Preparación</h4>

                <div class="my-3 text-center">
                    <img src="/img/preparacion.png" id="exerciseImage" class="img-fluid rounded shadow-sm" style="max-height: 250px; object-fit: cover;" alt="Guía del Ejercicio">
                </div>

                <p id="exerciseDesc" class="text-muted fs-5 fw-semibold instruction-text text-center">
                    Ubícate frente a la cámara, respira profundo y ajusta tu postura.
                </p>

                <div class="timer-display text-center" id="timer">--</div>

                <div class="mt-auto">
                    <button class="btn btn-success btn-lg w-100 mb-2" id="btnStart" onclick="iniciarTemporizador()">▶ EMPEZAR EJERCICIO</button>
                    <button class="btn btn-outline-primary w-100 mb-3" id="btnNext" onclick="siguienteEjercicio()" disabled>Siguiente Ejercicio ⏭</button>

                    <hr class="text-muted my-2">
                    <div class="row g-2 mt-1">
                        <div class="col-6">
                            <button class="btn btn-warning w-100 fw-bold shadow-sm" id="btnPausar" onclick="pausarActividad()">
                                ⏸ Pausar
                            </button>
                        </div>
                        <div class="col-6">
                            <a th:href="@{/dashboard}" class="btn btn-danger w-100 fw-bold shadow-sm" id="btnCancelar" onclick="return confirm('¿Seguro que deseas salir? La pausa activa quedará registrada como Incompleta.');">
                                ⏹ Cancelar
                            </a>
                        </div>
                    </div>

                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/pausa-activa.js}"></script>

</body>
</html>
