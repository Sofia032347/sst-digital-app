spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sst}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Conexion a la base de datos en Aiven
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
server.servlet.session.timeout=8h
server.servlet.session.cookie.max-age=28800
server.servlet.session.cookie.http-only=true
# Compatibilidad temporal con contraseÃ±as antiguas
sst.auth.allow-legacy-plaintext=false
# MigraciÃon de contraseñas deshabilitada por defecto
sst.password-migration.enabled=false
