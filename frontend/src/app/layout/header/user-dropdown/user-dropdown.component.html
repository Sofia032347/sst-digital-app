<div class="relative">

    <!-- ===================================== -->
    <!-- BOTÓN DEL USUARIO -->
    <!-- ===================================== -->

    <button
            app-button
            variant="unstyled"
            type="button"
            (click)="toggleDropdown($event)"

            [attr.aria-expanded]="isOpen"
            aria-label="Abrir menú de usuario"

            class="dropdown-toggle flex items-center
           text-gray-700 dark:text-gray-400"
    >

        <!-- AVATAR GENÉRICO -->

        <span
                class="me-3 flex size-11 shrink-0 items-center
             justify-center overflow-hidden rounded-lg
             bg-brand-500 text-sm font-bold text-white"
        >
      {{ iniciales }}
    </span>

        <!-- NOMBRE REAL -->

        <span
                class="me-1 block max-w-32 truncate
             text-sm font-medium"
        >
      {{ nombreCorto }}
    </span>

        <!-- FLECHA -->

        <svg
                class="size-5 text-gray-500 duration-200
             dark:text-gray-400"

                [ngClass]="isOpen
        ? 'rotate-180'
        : 'rotate-0'"

                width="20"
                height="20"
                viewBox="0 0 20 20"
                fill="none"
                aria-hidden="true"
        >

            <path
                    d="M4.79175 7.396
           L10.0001 12.6043
           L15.2084 7.396"

                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
            />

        </svg>

    </button>

    <!-- ===================================== -->
    <!-- MENÚ DESPLEGABLE -->
    <!-- ===================================== -->

    @if (isOpen) {

    <div
            class="absolute end-0 z-50 mt-3 flex w-72
             flex-col gap-1 rounded-2xl border
             border-gray-200 bg-white p-3
             shadow-theme-lg outline-none
             dark:border-gray-800
             dark:bg-[#1E2635]"
    >

        <!-- ================================= -->
        <!-- IDENTIDAD DEL EMPLEADO -->
        <!-- ================================= -->

        <div class="px-3 py-3">

        <span
                class="block break-words text-sm
                 font-semibold text-gray-800
                 dark:text-white"
        >
          {{ nombreUsuario }}
        </span>

            @if (correoUsuario) {

            <span
                    class="mt-1 block break-all text-xs
                   text-gray-500 dark:text-gray-400"
            >
            {{ correoUsuario }}
          </span>

            } @else {

            <span
                    class="mt-1 block text-xs text-gray-500
                   dark:text-gray-400"
            >
            {{
              cargandoUsuario
                ? 'Cargando correo...'
                : 'Correo no disponible'
            }}
          </span>

            }

        </div>

        <!-- SEPARADOR -->

        <div
                class="-mx-3 my-1.5 h-px bg-gray-100
               dark:bg-gray-700"
        ></div>

        <!-- ================================= -->
        <!-- MI CUENTA -->
        <!-- ================================= -->

        <a
                [routerLink]="rutaPerfil"
                (click)="closeDropdown()"

                class="group/dropdown-menu-item relative
               flex cursor-pointer items-center
               gap-3 rounded-lg px-3 py-2.5
               text-sm font-medium text-gray-700
               outline-hidden transition-colors
               duration-200 select-none
               hover:bg-gray-100
               hover:text-gray-700
               focus:bg-gray-100
               dark:text-gray-300
               dark:hover:bg-white/5"
        >

            <svg
                    class="size-6 shrink-0 text-gray-500
                 dark:text-gray-400"

                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
            >
                <circle cx="12" cy="8" r="4"/>

                <path
                        d="M4 21v-2a8 8 0 0 1
               16 0v2"
                />
            </svg>

            <span>Mi cuenta</span>

        </a>


        <!-- SEPARADOR -->

        <div
                class="-mx-3 my-1.5 h-px bg-gray-100
               dark:bg-gray-700"
        ></div>


        <!-- ================================= -->
        <!-- CERRAR SESIÓN -->
        <!-- ================================= -->

        <button
                type="button"
                (click)="cerrarSesion()"
                [disabled]="cerrandoSesion"

                class="group/dropdown-menu-item relative
         flex w-full cursor-pointer items-center
         gap-3 rounded-lg px-3 py-2.5
         text-left text-sm font-medium text-red-500
         outline-hidden transition-colors
         duration-200 select-none
         hover:bg-red-50 hover:text-red-600
         focus:bg-red-50
         disabled:cursor-not-allowed
         disabled:opacity-50
         dark:text-red-400
         dark:hover:bg-red-500/10"
        >

            <svg
                    class="size-5 shrink-0 text-red-500
           dark:text-red-400"
                    width="24"
                    height="24"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
            >
                <path
                        d="M4 12h7.75
         M8 8l-3.998 4 3.997 4
         M9.75 4.996V4.25
         a1.5 1.5 0 011.5-1.5h6
         a1.5 1.5 0 011.5 1.5v15.5
         a1.5 1.5 0 01-1.5 1.5h-6
         a1.5 1.5 0 01-1.5-1.5V19"
                />
            </svg>

            <span>
    {{ cerrandoSesion
       ? 'Cerrando sesión...'
       : 'Cerrar sesión' }}
  </span>

        </button>


    </div>

    }

</div>
