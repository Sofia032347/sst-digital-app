
<div
        class="relative z-1 bg-white p-6
         dark:bg-gray-900 sm:p-0"
>
  <div
          class="relative flex h-screen w-full
           flex-col justify-center
           lg:flex-row dark:bg-gray-900"
  >

    <!-- ===================================== -->
    <!-- FORMULARIO ORIGINAL DE TAILADMIN -->
    <!-- ===================================== -->

    <ng-content></ng-content>

    <!-- ===================================== -->
    <!-- PANEL DE PRESENTACIÓN SST DIGITAL -->
    <!-- ===================================== -->

    <div
            class="relative hidden h-full w-full
             items-center bg-brand-950
             lg:grid lg:w-1/2
             dark:bg-white/5"
    >

      <div
              class="z-1 flex items-center
               justify-center px-8"
      >

        <!-- DECORACIÓN DE TAILADMIN -->

        <app-grid-shape />

        <div
                class="flex max-w-md
                 flex-col items-center text-center"
        >

          <!-- LOGO SST DIGITAL -->

          <div
                  class="mb-6 flex h-20 w-20
                   items-center justify-center
                   rounded-2xl bg-blue-600
                   text-white shadow-lg"
          >

            <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="46"
                    height="46"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
            >
              <path
                      d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0
                   L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8
                   7.8L12 21l8.8-8.6a5.5 5.5
                   0 0 0 0-7.8Z"
              />

              <path d="M4 12h4l2-3 3 6 2-3h5"/>
            </svg>

          </div>

          <h1
                  class="text-4xl font-bold
                   tracking-tight text-white"
          >
            SST Digital
          </h1>

          <p
                  class="mt-3 text-lg font-medium
                   text-blue-200"
          >
            Bienestar y prevención laboral
          </p>

          <p
                  class="mt-5 max-w-sm text-sm
                   leading-7 text-gray-400
                   dark:text-white/60"
          >
            Una plataforma para promover
            hábitos saludables, realizar
            pausas activas y acompañar
            el bienestar de tu equipo.
          </p>

          <!-- INFORMACIÓN DEL SISTEMA -->

          <div
                  class="mt-8 flex flex-wrap
                   justify-center gap-3"
          >

            <span
                    class="rounded-full border
                     border-white/15 bg-white/5
                     px-4 py-2 text-xs
                     font-medium text-gray-300"
            >
              Pausas activas
            </span>

            <span
                    class="rounded-full border
                     border-white/15 bg-white/5
                     px-4 py-2 text-xs
                     font-medium text-gray-300"
            >
              Seguimiento
            </span>

            <span
                    class="rounded-full border
                     border-white/15 bg-white/5
                     px-4 py-2 text-xs
                     font-medium text-gray-300"
            >
              Bienestar laboral
            </span>

          </div>

        </div>

      </div>

    </div>

    <!-- ===================================== -->
    <!-- SELECTOR DE TEMA ORIGINAL -->
    <!-- ===================================== -->

    <div
            class="fixed bottom-6 z-50 hidden
             ltr:right-6 rtl:left-6 sm:block"
    >
      <app-theme-toggle-two />
    </div>

  </div>
</div>
