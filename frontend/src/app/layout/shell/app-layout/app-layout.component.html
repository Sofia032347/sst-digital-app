<div class="min-h-screen xl:flex">

    <!-- ====================================== -->
    <!-- TEMPORIZADOR Y NOTIFICACIONES GLOBALES -->
    <!-- ====================================== -->

    <app-recordatorios-globales/>

    <!-- ====================================== -->
    <!-- MENÚ LATERAL -->
    <!-- ====================================== -->

    <div>
        <app-sidebar></app-sidebar>
        <app-backdrop></app-backdrop>
    </div>

    <!-- ====================================== -->
    <!-- CONTENIDO PRINCIPAL -->
    <!-- ====================================== -->

    <div
            class="flex-1 transition-all duration-300 ease-in-out"
            [ngClass]="{
            'xl:ms-[290px]':
                (isExpanded$ | async) ||
                (isHovered$ | async),

            'xl:ms-[90px]':
                !(isExpanded$ | async) &&
                !(isHovered$ | async),

            'ms-0':
                (isMobileOpen$ | async)
        }"
    >

        <!-- ================================== -->
        <!-- ENCABEZADO DE TAILADMIN -->
        <!-- ================================== -->

        <app-header/>

        <!-- ================================== -->
        <!-- CONTENIDO DE LA PÁGINA -->
        <!-- ================================== -->

        <div
                class="p-4 mx-auto w-full
                   max-w-(--breakpoint-2xl) md:p-6"
        >
            <router-outlet></router-outlet>
        </div>

    </div>

</div>
