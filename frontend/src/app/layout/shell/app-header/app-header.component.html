
<header
        class="sticky top-0 z-50 flex w-full shrink-0
         border-gray-200 bg-white xl:border-b
         dark:border-gray-800 dark:bg-gray-900"
>
  <div
          class="flex grow flex-col items-center justify-between
           xl:flex-row xl:px-6"
  >

    <!-- ===================================== -->
    <!-- LADO IZQUIERDO -->
    <!-- ===================================== -->

    <div
            class="flex w-full items-center justify-between
             gap-2 border-b border-gray-200
             px-3 py-3 sm:gap-4
             xl:w-auto xl:justify-start
             xl:border-b-0 xl:px-0 xl:py-4
             dark:border-gray-800"
    >

      <!-- BOTÓN DEL MENÚ LATERAL -->

      <button
              app-button
              variant="unstyled"
              type="button"

              (click)="handleToggle()"

              aria-label="Abrir o cerrar menú lateral"

              class="inline-flex size-10 items-center
               justify-center rounded-[10px]
               border border-gray-300
               bg-transparent text-gray-500
               shadow-theme-xs transition-all
               hover:bg-gray-50 hover:text-gray-800
               lg:size-11 dark:border-gray-700
               dark:bg-gray-800 dark:text-gray-400
               dark:hover:bg-gray-700/50
               dark:hover:text-white"

              [ngClass]="{
          'bg-gray-100 dark:bg-white/3':
            isMobileOpen$ | async
        }"
      >

        @if (isMobileOpen$ | async) {

        <!-- ICONO CERRAR -->

        <svg
                class="size-6"
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
        >
          <path
                  fill-rule="evenodd"
                  clip-rule="evenodd"
                  d="M6.21967 7.28131
                 C5.92678 6.98841 5.92678 6.51354
                 6.21967 6.22065
                 C6.51256 5.92775 6.98744 5.92775
                 7.28033 6.22065
                 L11.999 10.9393
                 L16.7176 6.22078
                 C17.0105 5.92789 17.4854 5.92788
                 17.7782 6.22078
                 C18.0711 6.51367 18.0711 6.98855

                 L13.0597 12

                 L7.28033 17.7794

                 6.21967 17.7794
                 C5.92678 17.4865 5.92678 17.0116
                 6.21967 16.7187
                 L10.9384 12
                 L6.21967 7.28131Z"
                  fill="currentColor"
          />
        </svg>

        } @else {

        <!-- ICONO HAMBURGUESA -->

        <svg
                class="rtl:-scale-x-100"
                width="16"
                height="12"
                viewBox="0 0 16 12"
                fill="none"
        >
          <path
                  fill-rule="evenodd"
                  clip-rule="evenodd"
                  d="M0.583252 1
                 C0.583252 0.585788
                 0.919038 0.25 1.33325 0.25
                 H14.6666
                 C15.0808 0.25 15.4166 0.585786
                 15.4166 1
                 C15.4166 1.41421
                 15.0808 1.75 14.6666 1.75
                 H1.33325
                 C0.919038 1.75
                 0.583252 1.41422
                 0.583252 1Z

                 M0.583252 11
                 C0.583252 10.5858
                 0.919038 10.25 1.33325 10.25
                 H14.6666
                 C15.0808 10.25
                 15.4166 10.5858

                 H1.33325
                 C0.919038 11.75

                 0.583252 11Z

                 M1.33325 5.25
                 C0.919038 5.25

                 C0.583252 6.41421

                 H7.99992
                 C8.41413 6.75

                 8.41413 5.25
                 7.99992 5.25
                 H1.33325Z"
                  fill="currentColor"
          />
        </svg>

        }

      </button>

      <!-- ================================= -->
      <!-- LOGO ORIGINAL EN MÓVILES -->
      <!-- ================================= -->

      <a
              routerLink="/"
              class="xl:hidden"
              aria-label="Ir al inicio"
      >

        <img
                class="dark:hidden"
                src="/images/logo/logo.svg"
                alt="Logo"
                width="154"
                height="32"
        />

        <img
                class="hidden dark:block"
                src="/images/logo/logo-dark.svg"
                alt="Logo"
                width="154"
                height="32"
        />

      </a>

      <!-- ================================= -->
      <!-- MOSTRAR OPCIONES EN MÓVILES -->
      <!-- ================================= -->

      <button
              app-button
              variant="unstyled"
              type="button"

              (click)="toggleApplicationMenu()"

              aria-label="Mostrar opciones del usuario"

              [attr.aria-expanded]="
          isApplicationMenuOpen
        "

              class="inline-flex size-10 items-center
               justify-center rounded-lg
               text-gray-700 hover:bg-gray-100
               xl:hidden dark:text-gray-400
               dark:hover:bg-gray-800"
      >

        <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
        >
          <path
                  fill-rule="evenodd"
                  clip-rule="evenodd"
                  d="M5.99902 10.4951
               C6.82745 10.4951
               7.49902 11.1667

               M13.499 11.9951
               C13.499 11.1667
               12.8275 10.4951
               11.999 10.4951

               10.499 11.9951

               C12.8275 13.5051
               13.499 12.8335
               13.499 12.0051
               V11.9951Z"
                  fill="currentColor"
          />
        </svg>

      </button>

    </div>

    <!-- ===================================== -->
    <!-- LADO DERECHO -->
    <!-- ===================================== -->

    <!-- CORRECCIÓN:
         En móviles permanece oculto hasta
         pulsar el botón de los tres puntos.

         En escritorio xl:flex lo mantiene
         siempre visible.

         La propiedad display se aplica solo
         cuando se abre el menú móvil.
    -->

    <div
            class="hidden w-full items-center justify-between
             gap-4 px-5 py-4 shadow-theme-md
             xl:ms-auto xl:flex xl:w-auto
             xl:justify-end xl:px-0
             xl:shadow-none"

            [style.display]="
        isApplicationMenuOpen ? 'flex' : null
      "
    >

      <!-- MODO OSCURO Y CAMPANA -->

      <div
              class="flex items-center gap-2 2xsm:gap-3"
      >

        <app-theme-toggle-button />

        <app-notification-dropdown />

      </div>

      <!-- PERFIL DEL EMPLEADO -->

      <app-user-dropdown />

    </div>

  </div>
</header>
