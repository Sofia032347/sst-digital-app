
<form
        [formGroup]="signInForm"
        (ngSubmit)="onSubmit()"
        [class]="'space-y-5 ' + className"
        novalidate
>

  <!-- ====================================== -->
  <!-- CORREO ELECTRÓNICO -->
  <!-- ====================================== -->

  <div class="flex w-full flex-col gap-2">

    <label
            for="login-email"
            class="mb-1.5 block text-sm font-medium
             text-gray-700 dark:text-gray-400"
    >
      Correo electrónico
      <span class="text-red-500">*</span>
    </label>

    <input
            app-input
            unstyled
            id="login-email"
            formControlName="email"
            type="email"
            autocomplete="username"
            placeholder="correo@empresa.com"

            class="h-11 w-full min-w-0 rounded-[10px]
             border border-gray-300 bg-white
             px-4 py-2.5 text-sm text-gray-800
             shadow-theme-xs outline-hidden
             transition-colors
             placeholder:text-gray-400
             focus:border-brand-300
             focus:ring-3 focus:ring-brand-500/20
             dark:border-gray-700
             dark:bg-gray-900
             dark:text-white/90
             dark:placeholder:text-gray-500
             dark:focus:border-brand-500/40"

            [class.border-red-500]="isFieldInvalid('email')"
            [attr.aria-invalid]="isFieldInvalid('email')"
    />

    @if (isFieldInvalid('email')) {

    <p
            role="alert"
            class="text-sm text-red-500
               dark:text-red-400"
    >
      {{ getFieldError('email') }}
    </p>

    }

  </div>

  <!-- ====================================== -->
  <!-- CONTRASEÑA -->
  <!-- ====================================== -->

  <div class="flex w-full flex-col gap-2">

    <label
            for="login-password"
            class="mb-1.5 block text-sm font-medium
             text-gray-700 dark:text-gray-400"
    >
      Contraseña
      <span class="text-red-500">*</span>
    </label>

    <div
            class="relative flex h-11 w-full
             items-center rounded-[10px]
             border border-gray-300
             bg-white shadow-theme-xs
             transition-colors
             focus-within:border-brand-300
             focus-within:ring-3
             focus-within:ring-brand-500/20
             dark:border-gray-700
             dark:bg-gray-900
             dark:focus-within:border-brand-500/40"

            [class.border-red-500]="
        isFieldInvalid('password')
      "
    >

      <input
              id="login-password"
              formControlName="password"
              [type]="showPassword ? 'text' : 'password'"
              autocomplete="current-password"
              placeholder="Ingresa tu contraseña"

              class="h-full min-w-0 flex-1
               border-0 bg-transparent
               py-2.5 ps-4 pe-2
               text-sm text-gray-800
               outline-hidden
               placeholder:text-gray-400
               focus:outline-none
               dark:text-white/90
               dark:placeholder:text-gray-500"

              [attr.aria-invalid]="
          isFieldInvalid('password')
        "
      />

      <!-- MOSTRAR / OCULTAR CONTRASEÑA -->

      <div class="flex items-center pe-3.5">

        <button
                app-button
                variant="unstyled"
                type="button"
                (click)="togglePasswordVisibility()"

                [attr.aria-label]="
            showPassword
              ? 'Ocultar contraseña'
              : 'Mostrar contraseña'
          "

                class="flex size-7 items-center
                 justify-center rounded-md
                 text-gray-500 transition-colors
                 hover:bg-gray-50
                 hover:text-gray-800
                 dark:text-gray-400
                 dark:hover:bg-gray-700/50
                 dark:hover:text-white"
        >

          @if (showPassword) {

          <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
          >
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>

          } @else {

          <svg
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
          >
            <path d="M3 3l18 18"/>
            <path d="M10.6 5.1A11.7 11.7 0 0 1 12 5c6.5 0 10 7 10 7a15 15 0 0 1-3.1 3.8"/>
            <path d="M6 6.5C3.4 8.3 2 12 2 12s3.5 7 10 7a10.6 10.6 0 0 0 4-.8"/>
            <path d="M10 10a3 3 0 0 0 4 4"/>
          </svg>

          }

        </button>

      </div>

    </div>

    @if (isFieldInvalid('password')) {

    <p
            role="alert"
            class="text-sm text-red-500
               dark:text-red-400"
    >
      {{ getFieldError('password') }}
    </p>

    }

  </div>

  <!-- ====================================== -->
  <!-- AYUDA CON CONTRASEÑA -->
  <!-- ====================================== -->

  <div class="flex justify-end">

    <button
            type="button"
            (click)="mostrarAyudaContrasena()"

            class="text-sm font-medium
             text-brand-500
             hover:text-brand-600
             dark:text-brand-400"
    >
      ¿Olvidaste tu contraseña?
    </button>

  </div>

  <!-- ====================================== -->
  <!-- ERROR DE AUTENTICACIÓN -->
  <!-- ====================================== -->

  @if (errorLogin) {

  <div
          role="alert"
          class="rounded-lg border border-red-200
             bg-red-50 p-3
             dark:border-red-900
             dark:bg-red-900/20"
  >

    <p
            class="text-sm text-red-700
               dark:text-red-300"
    >
      {{ errorLogin }}
    </p>

  </div>

  }

  <!-- ====================================== -->
  <!-- BOTÓN INICIAR SESIÓN -->
  <!-- ====================================== -->

  <div>

    <button
            app-button
            variant="unstyled"
            type="submit"

            [disabled]="isSubmitting"

            class="inline-flex h-11 w-full
             items-center justify-center
             gap-2 rounded-[10px]
             bg-brand-500 px-5 py-3
             text-sm font-medium text-white
             shadow-theme-xs transition-all
             hover:bg-brand-600
             disabled:cursor-not-allowed
             disabled:bg-brand-200
             dark:disabled:bg-brand-800"
    >

      @if (isSubmitting) {

      <svg
              class="size-4 animate-spin"
              viewBox="0 0 24 24"
              fill="none"
              aria-hidden="true"
      >
        <circle
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
                class="opacity-25"
        />
        <path
                fill="currentColor"
                class="opacity-75"
                d="M4 12a8 8 0 0 1 8-8V0
               C5.4 0 0 5.4 0 12h4z"
        />
      </svg>

      <span>Iniciando sesión...</span>

      } @else {

      <span>Iniciar sesión</span>

      }

    </button>

  </div>

</form>
