
<div
        [class]="
    'flex w-full flex-1 flex-col lg:w-1/2 ' +
    className
  "
>

  <!-- ===================================== -->
  <!-- ESPACIO SUPERIOR -->
  <!-- ===================================== -->

  <div
          class="mx-auto mb-5 w-full max-w-md
           sm:pt-10"
  >
  </div>

  <!-- ===================================== -->
  <!-- CONTENIDO DE INICIO DE SESIÓN -->
  <!-- ===================================== -->

  <div
          class="mx-auto flex w-full max-w-md
           flex-1 flex-col justify-center"
  >

    <!-- ===================================== -->
    <!-- ENCABEZADO SST DIGITAL -->
    <!-- ===================================== -->

    <div class="mb-8">

      <h1
              class="mb-2 text-2xl font-bold
               text-gray-800
               dark:text-white/90"
      >
        Iniciar sesión
      </h1>

      <p
              class="text-sm leading-6
               text-gray-500
               dark:text-gray-400"
      >
        Ingresa tu correo electrónico y contraseña
        para acceder a SST Digital.
      </p>

    </div>

    <!-- ===================================== -->
    <!-- FORMULARIO ORIGINAL DE TAILADMIN -->
    <!-- ===================================== -->

    <app-sign-in-form-fields />

    <!-- ===================================== -->
    <!-- INFORMACIÓN DE ACCESO -->
    <!-- ===================================== -->

    <div
            class="mt-6 rounded-xl border
             border-blue-200 bg-blue-50
             px-4 py-3
             dark:border-blue-900/50
             dark:bg-blue-900/10"
    >

      <div class="flex items-start gap-3">

        <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="mt-0.5 shrink-0
                 text-blue-600
                 dark:text-blue-400"
                aria-hidden="true"
        >
          <circle cx="12" cy="12" r="10" />
          <path d="M12 16v-4" />
          <path d="M12 8h.01" />
        </svg>

        <div>

          <p
                  class="text-sm font-semibold
                   text-blue-800
                   dark:text-blue-300"
          >
            ¿Necesitas ayuda para ingresar?
          </p>

          <p
                  class="mt-1 text-xs leading-5
                   text-blue-700
                   dark:text-blue-200"
          >
            Si olvidaste tu contraseña o tienes
            problemas para acceder, comunícate
            con tu jefe de Recursos Humanos.
          </p>

        </div>

      </div>

    </div>

  </div>

</div>
