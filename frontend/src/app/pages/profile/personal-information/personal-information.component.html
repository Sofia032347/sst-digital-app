<div
        class="group/card relative flex flex-col gap-5
         overflow-hidden rounded-xl border
         border-gray-200 bg-white p-5 sm:p-6 lg:p-7
         dark:border-gray-700 dark:bg-white/3"
>

    <!-- ENCABEZADO -->

    <div class="flex items-center justify-between gap-4">

        <h2
                class="text-base font-semibold text-gray-800
             sm:text-lg dark:text-white/90"
        >
            Información personal
        </h2>

        <button
                app-button
                variant="unstyled"
                type="button"
                (click)="isDialogOpen = true"
                class="shadow-theme-xs flex h-9 cursor-pointer
             items-center justify-center gap-2
             rounded-lg border border-gray-300
             bg-white px-3.5 text-sm font-medium
             text-gray-700 hover:bg-gray-50
             dark:border-gray-700 dark:bg-gray-800
             dark:text-gray-300"
        >

            <svg
                    width="18"
                    height="18"
                    viewBox="0 0 21 21"
                    fill="none"
                    class="size-4.5"
                    aria-hidden="true"
            >
                <path
                        fill-rule="evenodd"
                        clip-rule="evenodd"
                        d="M17.091 3.532a2.25 2.25 0 00-3.182 0l-8.302 8.302c-.308.308-.52.7-.61 1.126l-.735 3.485a.75.75 0 00.888.889l3.485-.735a2.25 2.25 0 001.127-.611l8.301-8.302a2.25 2.25 0 000-3.182l-.972-.972zm-2.121 1.06a.75.75 0 011.06 0l.973.973a.75.75 0 010 1.06l-.899.899-2.033-2.033.899-.898zm-1.96 1.96l-6.342 6.342a.75.75 0 00-.203.376l-.498 2.358 2.358-.497a.75.75 0 00.376-.204l6.343-6.342-2.033-2.033z"
                        fill="currentColor"
                />
            </svg>

            Editar

        </button>

    </div>

    <!-- FOTO Y DATOS PRINCIPALES -->

    <div class="mt-2 flex items-center gap-4 sm:gap-6">

        <div
                class="relative flex size-16 shrink-0
             overflow-hidden rounded-full sm:size-20"
        >

            @if (profileData.avatarUrl) {

            <img
                    [src]="profileData.avatarUrl"
                    [alt]="profileData.fullName || 'Foto del empleado'"
                    class="aspect-square size-full object-cover"
            />

            } @else {

            <div
                    class="flex size-full items-center justify-center
                 bg-brand-500 text-xl font-medium
                 text-white sm:text-2xl"
            >
                {{ iniciales }}
            </div>

            }

        </div>

        <div class="flex min-w-0 flex-col gap-1">

            <h3
                    class="break-words text-base font-semibold
               text-gray-800 sm:text-lg dark:text-white/90"
            >
                {{ profileData.fullName || 'Empleado' }}
            </h3>

            <p class="text-sm text-gray-500 dark:text-gray-400">
                {{ profileData.bio || 'Puesto no registrado' }}
            </p>

        </div>

    </div>

    <!-- INFORMACIÓN VISIBLE ANTES DE EDITAR -->

    <div
            class="mt-2 grid grid-cols-1 gap-6
           sm:grid-cols-2 lg:grid-cols-4"
    >

        <app-info-field
                label="Nombre completo"
                [value]="profileData.fullName || 'No registrado'"
        />

        <app-info-field
                label="Correo electrónico"
                [value]="profileData.email || 'No registrado'"
        />

        <app-info-field
                label="Teléfono"
                [value]="profileData.phone || 'No registrado'"
        />

        <app-info-field
                label="Puesto"
                [value]="profileData.bio || 'No registrado'"
        />

    </div>

</div>

<!-- MODAL ORIGINAL DE EDICIÓN -->
<app-edit-personal-info-dialog
        [isOpen]="isDialogOpen"
        [initialData]="profileData"
        [guardando]="guardando"
        (openChange)="isDialogOpen = $event"
        (save)="handleSave($event)"
/>
