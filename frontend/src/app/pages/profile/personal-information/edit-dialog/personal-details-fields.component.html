<div class="space-y-5">

    <h4 class="text-base font-medium text-gray-800 dark:text-white/90">
        Datos personales
    </h4>

    <p class="text-sm text-gray-500 dark:text-gray-400">
        Puedes consultar tus datos personales y actualizar
        tu departamento o área de trabajo.
    </p>

    <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">

        <!-- NOMBRE COMPLETO: SOLO LECTURA -->
        <div>
            <label
                    for="perfil-nombre"
                    class="mb-1.5 block text-sm font-medium
                       text-gray-700 dark:text-gray-400"
            >
                Nombre completo
            </label>

            <input
                    id="perfil-nombre"
                    type="text"
                    [value]="formData.firstName"
                    readonly
                    class="h-11 w-full rounded-lg border border-gray-300
                       bg-gray-50 px-4 py-2.5 text-sm
                       text-gray-600 cursor-not-allowed
                       dark:border-gray-700 dark:bg-gray-800
                       dark:text-gray-400"
            />
        </div>

        <!-- CORREO: SOLO LECTURA -->
        <div>
            <label
                    for="perfil-correo"
                    class="mb-1.5 block text-sm font-medium
                       text-gray-700 dark:text-gray-400"
            >
                Correo electrónico
            </label>

            <input
                    id="perfil-correo"
                    type="email"
                    [value]="formData.email"
                    readonly
                    class="h-11 w-full rounded-lg border border-gray-300
                       bg-gray-50 px-4 py-2.5 text-sm
                       text-gray-600 cursor-not-allowed
                       dark:border-gray-700 dark:bg-gray-800
                       dark:text-gray-400"
            />
        </div>

        <!-- DEPARTAMENTO: EDITABLE -->
        <div class="sm:col-span-2">

            <label
                    for="perfil-departamento"
                    class="mb-1.5 block text-sm font-medium
                       text-gray-700 dark:text-gray-400"
            >
                Departamento o área de trabajo
            </label>

            <input
                    app-input
                    unstyled
                    id="perfil-departamento"
                    type="text"
                    name="bio"
                    [(ngModel)]="formData.bio"
                    (ngModelChange)="limpiarError('bio')"
                    maxlength="100"
                    placeholder="Ej. Recursos Humanos, Administración"
                    class="h-11 w-full rounded-lg border border-gray-300
                       bg-transparent px-4 py-2.5 text-sm
                       text-gray-800 shadow-theme-xs
                       focus:border-brand-300 focus:outline-none
                       focus:ring-3 focus:ring-brand-500/20
                       dark:border-gray-700 dark:text-white/90"
            />

            @if (errors.bio) {
            <p class="mt-1 text-xs text-red-500">
                {{ errors.bio }}
            </p>
            }

            <p class="mt-1.5 text-xs text-gray-500">
                Este es el único dato personal que puedes
                modificar desde tu perfil.
            </p>
        </div>

    </div>

</div>
