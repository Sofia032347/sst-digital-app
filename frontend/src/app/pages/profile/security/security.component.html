
<div
        class="group/card flex flex-col gap-5
         rounded-2xl border border-gray-200
         bg-white p-5 lg:p-6
         dark:border-gray-700 dark:bg-white/3"
>

    <!-- TÍTULO -->

    <h2
            class="text-lg font-semibold
           text-gray-800 dark:text-white/90"
    >
        Seguridad
    </h2>

    <!-- CAMBIAR CONTRASEÑA -->

    <div
            class="mt-1 flex flex-col justify-between
           gap-4 sm:flex-row sm:items-center"
    >

        <div>

            <h3
                    class="mb-1 text-base font-medium
               text-gray-800 dark:text-white/90"
            >
                Cambiar contraseña
            </h3>

            <p
                    class="text-sm text-gray-500
               dark:text-gray-400"
            >
                Protege tu cuenta actualizando tu contraseña.
            </p>

        </div>

        <div class="flex shrink-0 items-center">

            <button
                    app-button
                    variant="unstyled"
                    type="button"
                    (click)="abrirCambioContrasena()"
                    class="shadow-theme-xs flex h-10
               cursor-pointer items-center
               justify-center gap-2 rounded-lg
               border border-gray-300 bg-white
               px-4 py-2.5 text-sm font-medium
               text-gray-700 hover:bg-gray-50
               hover:text-gray-800
               dark:border-gray-700
               dark:bg-gray-800
               dark:text-gray-400"
            >

                <svg
                        width="21"
                        height="21"
                        viewBox="0 0 21 21"
                        fill="none"
                        class="size-5"
                        aria-hidden="true"
                >
                    <path
                            fill-rule="evenodd"
                            clip-rule="evenodd"
                            d="M17.091 3.532a2.25 2.25 0 00-3.182 0l-8.302 8.302c-.308.308-.52.7-.61 1.126l-.735 3.485a.75.75 0 00.888.889l3.485-.735a2.25 2.25 0 001.127-.611l8.301-8.302a2.25 2.25 0 000-3.182l-.972-.972zm-2.121 1.06a.75.75 0 011.06 0l.973.973a.75.75 0 010 1.06l-.899.899-2.033-2.033.899-.898zm-1.96 1.96l-6.342 6.342a.75.75 0 00-.203.376l-.498 2.358 2.358-.497a.75.75 0 00.376-.204l6.343-6.342-2.033-2.033z"
                            fill="currentColor"
                    />
                </svg>

                <span>Cambiar contraseña</span>

            </button>

        </div>

    </div>

</div>

<!--
  El modal solo se crea cuando el usuario
  pulsa Cambiar contraseña.
-->

@if (isModalOpen) {

<app-change-password-modal
        [isOpen]="true"
        (openChange)="cerrarCambioContrasena()"
        (submitSuccess)="handlePasswordSubmit($event)"
/>

}
